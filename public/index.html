<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聊天室</title>
<style>
  * { box-sizing: border-box; }
  :root { --accent: #8ab4ff; }
  #cgBar stop:first-child, #cgSide stop:first-child { stop-color: var(--accent); }
  html, body { height: 100%; margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { display: flex; background: #0f1117; color: #e6e6e6; }
  #side { width: 210px; background: #161922; border-right: 1px solid #232733; display: flex; flex-direction: column; }
  #side h3 { margin: 0; padding: 14px; font-size: 15px; border-bottom: 1px solid #232733; color: var(--accent); }
  .sec-title { padding: 10px 14px 4px; font-size: 12px; color: #6b7280; }
  #channels, #users { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; }
  #channels li { padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  #channels li:hover { background: #1f2430; }
  #channels li.active { background: #2b3450; color: var(--accent); }
  .lock { font-size: 11px; color: #ffb454; }
  #users li { padding: 4px 10px; font-size: 13px; color: #9aa3b2; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
  #users li .nm { cursor: pointer; }
  #users li .nm:hover { color: var(--accent); }
  .kick { font-size: 11px; color: #ff6b6b; cursor: pointer; padding: 0 4px; }
  #addChannel { display: flex; padding: 8px; gap: 6px; }
  #addChannel input { flex: 1; background: #0f1117; border: 1px solid #2a2f3a; color: #e6e6e6; border-radius: 6px; padding: 6px; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #bar { padding: 12px 16px; border-bottom: 1px solid #232733; display: flex; align-items: center; gap: 10px; }
  #bar .ch { font-weight: 600; color: var(--accent); }
  #bar .locktag { font-size: 11px; color: #ffb454; }
  #bar .me { margin-left: auto; font-size: 13px; color: #9aa3b2; }
  #bar input { background: #0f1117; border: 1px solid #2a2f3a; color: #e6e6e6; border-radius: 6px; padding: 5px 8px; width: 120px; }
  /* 聊天室图标（左上角品牌标识） */
  .brand { display: inline-flex; align-items: center; flex: 0 0 auto; }
  .brand svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg .name { font-weight: 600; color: var(--accent); }
  .msg .time { font-size: 11px; color: #6b7280; margin-left: 6px; }
  .msg .text { margin-top: 2px; line-height: 1.5; word-break: break-word; }
  .msg img { max-width: 240px; max-height: 240px; border-radius: 8px; margin-top: 4px; display: block; }
  .mention { color: #ffb454; font-weight: 600; }
  .whisper { background: #1c1430; border-left: 3px solid #b07cff; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  .whisper .tag { color: #b07cff; font-weight: 600; }
  .sys { font-size: 12px; color: #6b7280; text-align: center; }
  .date-sep { font-size: 11px; color: #4b5563; text-align: center; margin: 6px 0 2px; }
  #inputBar { display: flex; padding: 12px; border-top: 1px solid #232733; gap: 8px; position: relative; }
  #inputBar input.txt { flex: 1; background: #0f1117; border: 1px solid #2a2f3a; color: #e6e6e6; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  #inputBar button { background: #2b3450; color: #fff; border: 0; border-radius: 8px; padding: 0 14px; cursor: pointer; }
  #inputBar button:hover { background: #34406a; }
  .iconbtn { background: #1f2430 !important; padding: 0 12px !important; }
  #emojiPanel { position: absolute; bottom: 56px; left: 12px; background: #161922; border: 1px solid #2a2f3a; border-radius: 8px; padding: 8px; display: none; grid-template-columns: repeat(8, 1fr); gap: 2px; width: 320px; max-height: 180px; overflow-y: auto; z-index: 10; }
  #emojiPanel span { cursor: pointer; font-size: 18px; text-align: center; padding: 4px; border-radius: 4px; }
  #emojiPanel span:hover { background: #2b3450; }
  .hint { font-size: 11px; color: #4b5563; padding: 0 12px 6px; }
  #fileInput { display: none; }
  /* 登录界面 / 管理员控制台 */
  #loginView, #adminView { position: fixed; inset: 0; background: #0f1117; display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  #adminView { background: rgba(8,10,16,.96); flex-direction: column; align-items: stretch; }
  .login-card { width: min(420px, 92vw); background: #161922; border: 1px solid #232733; border-radius: 14px; padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .login-card h2 { margin: 0 0 4px; font-size: 20px; color: var(--accent); }
  .login-card p.sub { margin: 0 0 16px; font-size: 13px; color: #9aa3b2; }
  .login-opt { border: 1px solid #2a2f3a; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .login-opt .t { font-size: 15px; font-weight: 600; color: #e6e6e6; }
  .login-opt .d { font-size: 12px; color: #9aa3b2; margin: 4px 0 10px; }
  .login-opt input { width: 100%; box-sizing: border-box; background: #0f1117; border: 1px solid #2a2f3a; color: #e6e6e6; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 8px; }
  .login-opt input:focus { outline: none; border-color: var(--accent); }
  .btn-primary { width: 100%; background: #2b3450; color: #fff; border: 0; border-radius: 8px; padding: 11px; font-size: 15px; cursor: pointer; }
  .btn-primary:hover { background: #34406a; }
  .btn-ghost { width: 100%; background: #1f2430; color: #cdd6e4; border: 1px solid #2b3240; border-radius: 8px; padding: 11px; font-size: 15px; cursor: pointer; }
  .btn-ghost:hover { background: #2b3450; }
  #loginErr { color: #ff6b6b; font-size: 13px; min-height: 18px; margin-top: 4px; text-align: center; }
  #adminView .ahead { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid #232733; }
  #adminView .ahead h2 { margin: 0; font-size: 18px; color: #ffb454; }
  #adminView .ahead .close { margin-left: auto; background: #1f2430; color: #cdd6e4; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  #adminList { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .admin-item { background: #161922; border: 1px solid #232733; border-radius: 10px; padding: 10px 12px; }
  .admin-item .meta { font-size: 13px; color: #9aa3b2; }
  .admin-item .meta .nm { color: var(--accent); font-weight: 600; }
  .admin-item .body { margin: 4px 0; font-size: 14px; color: #e6e6e6; word-break: break-word; }
  .admin-item .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .admin-item .acts button { background: #1f2430; color: #cdd6e4; border: 1px solid #2b3240; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
  .admin-item .acts .del { color: #ff6b6b; border-color: #4a2630; }
  .admin-item .geo { font-size: 12px; color: #6b7280; }
  /* 在线数据 / 主题色（管理员） */
  #statsBtn { background: #1f2430; color: var(--accent); border: 0; border-radius: 6px; padding: 0 12px; cursor: pointer; font-size: 16px; }
  #statsView { position: fixed; inset: 0; background: rgba(8,10,16,.96); display: none; flex-direction: column; align-items: stretch; z-index: 50; padding: 16px; box-sizing: border-box; }
  #statsView .shead { display: flex; align-items: center; padding: 6px 4px 14px; }
  #statsView .shead h2 { margin: 0; font-size: 18px; color: var(--accent); }
  #statsView .shead .close { margin-left: auto; background: #1f2430; color: #cdd6e4; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  #statsBody { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; max-width: 560px; width: 100%; margin: 0 auto; }
  .card-box { background: #161922; border: 1px solid #232733; border-radius: 12px; padding: 16px; }
  .big-count { font-size: 40px; font-weight: 700; color: var(--accent); line-height: 1; margin-top: 4px; }
  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .stat-row .it { background: #0f1117; border: 1px solid #232733; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #9aa3b2; }
  .stat-row .it b { color: #e6e6e6; font-size: 16px; margin-left: 6px; }
  #userList { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  #userList .u { background: #0f1117; border: 1px solid #232733; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  #userList .u .r { font-size: 11px; margin-left: 4px; color: #9aa3b2; }
  #chart { width: 100%; height: 150px; }
  .empty { color: #6b7280; font-size: 13px; }
  .color-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .color-row input[type=color] { width: 44px; height: 32px; border: 1px solid #2a2f3a; background: #0f1117; border-radius: 6px; cursor: pointer; padding: 2px; }
  .swatch { width: 26px; height: 26px; border-radius: 6px; border: 1px solid #2a2f3a; cursor: pointer; }

  /* 游戏板块：国际象棋 */
  #gameBtn { background: #1f2430; color: var(--accent); border: 0; border-radius: 6px; padding: 0 12px; cursor: pointer; font-size: 16px; }
  #gameView { display: none; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px; padding: 16px; flex: 1; overflow: auto; }
  #chessStatus { color: #cdd6e4; font-size: 15px; font-weight: 600; }
  #chessBoard { display: grid; grid-template-columns: repeat(8, 1fr); width: min(92vw, 460px); aspect-ratio: 1; border: 2px solid #2b3240; border-radius: 6px; overflow: hidden; }
  .cell { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
  .cell.light { background: #eef0f3; }
  .cell.dark { background: #7c8aa0; }
  .cell .piece { font-size: min(11vw, 40px); line-height: 1; }
  .cell .piece.w { color: #fff; text-shadow: 0 0 1px #000, 0 0 2px #000; }
  .cell .piece.b { color: #222; }
  .cell.selected { box-shadow: inset 0 0 0 3px #ffd54a; }
  .cell.move::after { content: ''; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(40,160,80,.6); }
  .cell.move.capture::after { width: 78%; height: 78%; background: transparent; border: 4px solid rgba(200,40,40,.7); border-radius: 50%; }
  #gameCtrls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #gameCtrls button, #onlineCtrls button { background: #1f2430; color: #cdd6e4; border: 1px solid #2b3240; border-radius: 6px; padding: 9px 14px; cursor: pointer; font-size: 14px; }
  #gameCtrls button:hover, #onlineCtrls button:hover { background: #2b3450; }
  /* 移动端适配 */
  #menuBtn { display: none; background: #1f2430; color: var(--accent); border: 0; border-radius: 6px; padding: 0 12px; cursor: pointer; font-size: 16px; }
  #sideClose { display: none; position: absolute; top: 10px; right: 10px; background: transparent; border: 0; color: #9aa3b2; font-size: 18px; cursor: pointer; z-index: 1; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; }
  @media (max-width: 640px) {
    #side { position: fixed; top: 0; bottom: 0; left: 0; width: 220px; transform: translateX(-100%); transition: transform .2s; z-index: 30; box-shadow: 2px 0 12px rgba(0,0,0,.5); }
    #side.open { transform: none; }
    #sideClose { display: block; }
    #main { width: 100%; }
    #bar { gap: 8px; padding: 10px 12px; }
    #menuBtn { display: block; }
    #bar .me { font-size: 12px; }
    #bar input { width: 92px; }
    #inputBar { padding: 8px; gap: 6px; }
    #inputBar input.txt { padding: 12px; font-size: 16px; }
    #log { padding: 12px; }
    .msg .text { font-size: 15px; }
    #overlay.show { display: block; }
  }
</style>
</head>
<body>
  <!-- 登录界面 -->
  <div id="loginView">
    <div class="login-card">
      <h2>💬 聊天室登录</h2>
      <p class="sub">请选择登录方式进入公开房间</p>
      <div class="login-opt">
        <div class="t">访客登录</div>
        <div class="d">仅可查看消息，无法发言或操作</div>
        <button class="btn-ghost" id="guestLoginBtn">以访客身份进入</button>
      </div>
      <div class="login-opt">
        <div class="t">昵称登录</div>
        <div class="d">填写发言时显示的名字（必填）</div>
        <input id="loginName" maxlength="16" placeholder="你的名字">
        <div class="d">管理口令（可选，填对特殊数字进入管理员）</div>
        <input id="loginCode" inputmode="numeric" placeholder="可选，管理口令">
        <button class="btn-primary" id="nameLoginBtn">进入聊天室</button>
      </div>
      <div id="loginErr"></div>
    </div>
  </div>
  <!-- 管理员控制台 -->
  <div id="adminView" style="display:none;">
    <div class="ahead"><h2>🛡 管理员控制台</h2><button class="close" id="adminClose">关闭</button></div>
    <div id="adminList"></div>
  </div>
  <!-- 在线数据 / 主题色（管理员） -->
  <div id="statsView" style="display:none;">
    <div class="shead"><h2>📊 在线数据</h2><button class="close" id="statsClose">关闭</button></div>
    <div id="statsBody">
      <div class="card-box">
        <div style="font-size:13px;color:#9aa3b2;">当前在线人数</div>
        <div class="big-count" id="onlineCount">0</div>
        <div class="stat-row">
          <div class="it">峰值<b id="peakCount">0</b></div>
          <div class="it">累计不同用户<b id="distinctCount">0</b></div>
          <div class="it">采样点<b id="sampleCount">0</b></div>
        </div>
      </div>
      <div class="card-box">
        <div style="font-size:13px;color:#9aa3b2;margin-bottom:4px;">在线用户</div>
        <div id="userList"></div>
      </div>
      <div class="card-box">
        <div style="font-size:13px;color:#9aa3b2;margin-bottom:6px;">人数变化（每 5 秒采样）</div>
        <div id="chart"></div>
      </div>
      <div class="card-box">
        <div style="font-size:13px;color:#9aa3b2;margin-bottom:4px;">聊天室主题色（全员生效）</div>
        <div class="color-row">
          <input type="color" id="colorPick" value="#8ab4ff">
          <span class="swatch" data-c="#8ab4ff" style="background:#8ab4ff"></span>
          <span class="swatch" data-c="#10b981" style="background:#10b981"></span>
          <span class="swatch" data-c="#f59e0b" style="background:#f59e0b"></span>
          <span class="swatch" data-c="#ef4444" style="background:#ef4444"></span>
          <span class="swatch" data-c="#a855f7" style="background:#a855f7"></span>
          <span class="swatch" data-c="#ec4899" style="background:#ec4899"></span>
        </div>
      </div>
    </div>
  </div>
  <div id="side">
    <button id="sideClose" title="关闭">✕</button>
    <h3><span class="brand" style="margin-right:8px;"><svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="cgSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs><rect x="2" y="2" width="28" height="28" rx="9" fill="url(#cgSide)"/><rect x="8.5" y="8.5" width="15" height="11" rx="3.5" fill="#fff"/><path d="M12.5 19.5 L12.5 24 L17.5 19.5 Z" fill="#fff"/><circle cx="13.5" cy="14" r="1.35" fill="#10b981"/><circle cx="16.5" cy="14" r="1.35" fill="#10b981"/><circle cx="19.5" cy="14" r="1.35" fill="#10b981"/></svg></span>聊天室</h3>
    <div class="sec-title">在线</div>
    <ul id="users"></ul>
  </div>
  <div id="overlay"></div>
  <div id="main">
    <div id="tempNotice" style="background:#2a1f10;color:#ffb454;font-size:12px;text-align:center;padding:6px 12px;border-bottom:1px solid #232733;">⚠ 临时房间：聊天记录不永久保存，刷新或服务器重启可能清空</div>
    <div id="bar">
      <span class="brand" title="聊天室">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
          <defs><linearGradient id="cgBar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs>
          <rect x="2" y="2" width="28" height="28" rx="9" fill="url(#cgBar)"/>
          <rect x="8.5" y="8.5" width="15" height="11" rx="3.5" fill="#fff"/>
          <path d="M12.5 19.5 L12.5 24 L17.5 19.5 Z" fill="#fff"/>
          <circle cx="13.5" cy="14" r="1.35" fill="#10b981"/>
          <circle cx="16.5" cy="14" r="1.35" fill="#10b981"/>
          <circle cx="19.5" cy="14" r="1.35" fill="#10b981"/>
        </svg>
      </span>
      <button id="menuBtn" title="在线列表">☰</button>
      <button id="gameBtn" title="小游戏">🎮</button>
      <button id="adminBtn" style="display:none;" title="管理">🛡</button>
      <button id="statsBtn" style="display:none;" title="在线数据">📊</button>
      <span class="ch">公开房间</span>
      <span class="me">我是 <input id="nick" maxlength="16"></span>
    </div>
    <div id="log"></div>
    <div class="hint" id="hint">/@昵称 提醒 · /w 昵称 消息 私聊 · 点用户名发起私聊</div>
    <div id="inputBar">
      <button class="iconbtn" id="emojiBtn" title="表情">😀</button>
      <button class="iconbtn" id="imgBtn" title="图片">📎</button>
      <input class="txt" id="text" placeholder="输入消息，回车发送…" autofocus>
      <button id="send">发送</button>
      <div id="emojiPanel"></div>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div id="gameView">
      <div id="chessStatus">白方 走棋</div>
      <div id="chessBoard"></div>
      <div id="gameCtrls">
        <button id="newGameBtn">新对局</button>
        <button id="undoBtn">悔棋</button>
        <button id="modeBtn">模式：双人对战</button>
      </div>
      <div id="onlineCtrls" style="display:none; gap:8px; flex-wrap:wrap; justify-content:center;">
        <button id="matchBtn">匹配对手</button>
        <button id="resignBtn">认输</button>
      </div>
      <div class="hint">点棋子选中，再点高亮格落子 · 升变自动为后</div>
    </div>
  </div>

<script src="chess-game.js"></script>
<script>
  const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${wsProto}://${location.host}`);
  let myName = '', curChannel = 'general', curIsOwner = false, lastDate = null;
  let myRole = '', wsReady = false, pendingLogin = null, adminFeed = [], lastStats = null;
  const $ = (id) => document.getElementById(id);
  const log = $('log');
  const EMOJIS = '😀😁😂🤣😊😍😘😎🤔😴😭😡👍👎👏🙏💪❤️🔥⭐🌹🎉🍺☕🚀💡⚡🌈😇🤝💯🐱🐶🌟💥🎈'.match(/./gu);

  function dateSepText(d) {
    const today = new Date().toISOString().slice(0, 10);
    const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (d === today) return '今天';
    if (d === y) return '昨天';
    return d;
  }
  function addDateSep(d) {
    const s = document.createElement('div'); s.className = 'date-sep'; s.textContent = '— ' + dateSepText(d) + ' —';
    log.appendChild(s); lastDate = d;
  }
  function setTextWithMentions(el, text) {
    const re = /@([^\s@]+)/g; let last = 0; let mm;
    while ((mm = re.exec(text))) {
      if (mm.index > last) el.appendChild(document.createTextNode(text.slice(last, mm.index)));
      const s = document.createElement('span'); s.className = 'mention'; s.textContent = '@' + mm[1];
      el.appendChild(s); last = re.lastIndex;
    }
    if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
  }
  function addMsg(name, text, time, date, image, id) {
    if (date && date !== lastDate) addDateSep(date);
    const d = document.createElement('div'); d.className = 'msg';
    if (id != null) d.dataset.id = id;
    d.innerHTML = `<span class="name"></span><span class="time"></span><div class="text"></div>`;
    d.querySelector('.name').textContent = name;
    d.querySelector('.time').textContent = time || '';
    if (image) { const img = document.createElement('img'); img.src = image; d.querySelector('.text').appendChild(img); }
    if (text) setTextWithMentions(d.querySelector('.text'), text);
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }
  function addWhisper(from, to, text, time, dir) {
    const d = document.createElement('div'); d.className = 'whisper';
    const tag = dir === 'out' ? `私聊 → ${to}` : `私聊 ← ${from}`;
    d.innerHTML = `<span class="tag"></span> <span class="time"></span><div class="text"></div>`;
    d.querySelector('.tag').textContent = tag;
    d.querySelector('.time').textContent = time || '';
    d.querySelector('.text').textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }
  function addSys(t) { const d = document.createElement('div'); d.className = 'sys'; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; }

  ws.onopen = () => {
    wsReady = true;
    $('nick').focus();
    if (pendingLogin) { ws.send(JSON.stringify(pendingLogin)); pendingLogin = null; }
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'welcome') { myName = m.name; myRole = m.role || 'user'; curChannel = m.channel; $('nick').value = myName; $('loginView').style.display = 'none'; applyRole(); }
    else if (m.type === 'login_fail') { $('loginErr').textContent = m.reason || '登录失败'; }
    else if (m.type === 'users') { renderUsers(m.list); }
    else if (m.type === 'history') { log.innerHTML = ''; lastDate = null; addSys('— 以下为历史消息 —'); (m.messages || []).forEach(x => addMsg(x.name, x.text, x.time, x.date, x.image, x.id)); }
    else if (m.type === 'chat') { addMsg(m.name, m.text, m.time, m.date, m.image, m.id); }
    else if (m.type === 'delete_msg') { removeMsgDom(m.id); adminFeed = adminFeed.filter(x => x.id !== m.id); if ($('adminView').style.display !== 'none') renderAdmin(); }
    else if (m.type === 'mention') { addSys(`💬 ${m.from} @了你：${m.text}`); document.title = '💬 有人@你'; setTimeout(() => document.title = '聊天室', 3000); }
    else if (m.type === 'whisper') { addWhisper(m.from, m.to, m.text, m.time, m.dir); }
    else if (m.type === 'sys') { addSys(m.text); }
    else if (m.type === 'admin_recent') { adminFeed = m.messages || []; if ($('adminView').style.display !== 'none') renderAdmin(); }
    else if (m.type === 'admin_msg') { adminFeed.push(m); if (adminFeed.length > 100) adminFeed.shift(); if ($('adminView').style.display !== 'none') renderAdmin(); }
    else if (m.type === 'admin_geo') { const el = document.querySelector('#adminList [data-id="' + m.id + '"] .geo'); if (el) el.textContent = '📍 ' + m.geo; }
    else if (m.type === 'room_color') { document.documentElement.style.setProperty('--accent', m.color); }
    else if (m.type === 'admin_stats') { lastStats = m; if ($('statsView').style.display !== 'none') renderStats(m); }
    else if (m.type === 'chess_wait' || m.type === 'chess_start' || m.type === 'chess_state' || m.type === 'chess_err' || m.type === 'chess_end') { if (window.ChessGame) window.ChessGame.handle(m); }
  };

  function renderUsers(list) {
    const ul = $('users'); ul.innerHTML = '';
    (list || []).forEach(n => {
      const li = document.createElement('li');
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = '● ' + n;
      nm.onclick = () => { $('text').value = '/w ' + n + ' '; $('text').focus(); };
      li.appendChild(nm);
      ul.appendChild(li);
    });
  }

  function sendMsg() {
    const raw = $('text').value;
    const t = raw.trim();
    if (!t) return;
    const m = t.match(/^\/(w|whisper)\s+(\S+)\s+([\s\S]+)$/);
    if (m) ws.send(JSON.stringify({ type: 'whisper', to: m[2], text: m[3] }));
    else ws.send(JSON.stringify({ type: 'msg', text: t }));
    $('text').value = '';
  }
  $('send').onclick = sendMsg;
  $('text').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
  $('nick').addEventListener('change', () => { const n = $('nick').value.trim(); if (n && n !== myName) { ws.send(JSON.stringify({ type: 'join', name: n })); myName = n; } });

  // 表情面板
  const ep = $('emojiPanel');
  EMOJIS.forEach(em => { const s = document.createElement('span'); s.textContent = em; s.onclick = () => { $('text').value += em; $('text').focus(); }; ep.appendChild(s); });
  $('emojiBtn').onclick = () => { ep.style.display = ep.style.display === 'grid' ? 'none' : 'grid'; };

  // 图片上传
  $('imgBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = () => {
    const f = $('fileInput').files[0]; if (!f) return;
    if (f.size > 1200000) { alert('图片超过 1.2MB，请压缩后再发'); $('fileInput').value = ''; return; }
    const r = new FileReader();
    r.onload = () => { ws.send(JSON.stringify({ type: 'msg', image: r.result })); };
    r.readAsDataURL(f);
    $('fileInput').value = '';
  };

  // 移动端抽屉：在线列表
  $('menuBtn').onclick = () => { $('side').classList.add('open'); $('overlay').classList.add('show'); };
  $('sideClose').onclick = () => { $('side').classList.remove('open'); $('overlay').classList.remove('show'); };
  $('overlay').onclick = () => { $('side').classList.remove('open'); $('overlay').classList.remove('show'); };

  // ===================== 登录 / 权限 =====================
  function doLogin(payload) {
    if (!wsReady) { pendingLogin = payload; return; }
    ws.send(JSON.stringify(payload));
  }
  $('guestLoginBtn').onclick = () => doLogin({ type: 'login', mode: 'guest' });
  $('nameLoginBtn').onclick = () => {
    const name = $('loginName').value.trim();
    const code = $('loginCode').value.trim();
    if (!name) { $('loginErr').textContent = '名字必填'; return; }
    doLogin({ type: 'login', mode: 'user', name, code });
  };
  $('loginName').addEventListener('keydown', e => { if (e.key === 'Enter') $('nameLoginBtn').click(); });

  function applyRole() {
    window.MY_ROLE = myRole;
    if (myRole === 'guest') {
      $('inputBar').style.display = 'none';
      $('gameBtn').style.display = 'none';
      $('nick').disabled = true;
      const b = document.createElement('div'); b.id = 'guestBanner';
      b.style.cssText = 'background:#1a2030;color:#9aa3b2;font-size:12px;text-align:center;padding:6px 12px;border-bottom:1px solid #232733;';
      b.textContent = '访客模式：仅可查看消息，无法发言或操作';
      $('main').insertBefore(b, $('bar'));
    } else if (myRole === 'admin') {
      $('adminBtn').style.display = '';
      $('statsBtn').style.display = '';
    }
  }
  function removeMsgDom(id) { document.querySelectorAll('#log [data-id="' + id + '"]').forEach(n => n.remove()); }

  // ===================== 管理员控制台 =====================
  $('adminBtn').onclick = () => { $('adminView').style.display = 'flex'; renderAdmin(); };
  $('adminClose').onclick = () => { $('adminView').style.display = 'none'; };
  // ===================== 在线数据 / 主题色 =====================
  $('statsBtn').onclick = () => {
    $('statsView').style.display = 'flex';
    const cur = (getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()) || '#8ab4ff';
    $('colorPick').value = cur;
    if (lastStats) renderStats(lastStats); else $('chart').innerHTML = '<div class="empty">数据采集中…（每 5 秒采样）</div>';
  };
  $('statsClose').onclick = () => { $('statsView').style.display = 'none'; };
  $('colorPick').oninput = () => { ws.send(JSON.stringify({ type: 'set_color', color: $('colorPick').value })); };
  document.querySelectorAll('.swatch').forEach(s => s.onclick = () => { const c = s.dataset.c; $('colorPick').value = c; ws.send(JSON.stringify({ type: 'set_color', color: c })); });
  function renderAdmin() {
    const ul = $('adminList'); ul.innerHTML = '';
    adminFeed.slice().reverse().forEach(x => {
      const d = document.createElement('div'); d.className = 'admin-item'; d.dataset.id = x.id;
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.innerHTML = '<span class="nm"></span> <span class="t"></span>';
      meta.querySelector('.nm').textContent = x.name;
      meta.querySelector('.t').textContent = (x.time || '') + (x.ip ? ' · ' + x.ip : '');
      d.appendChild(meta);
      const body = document.createElement('div'); body.className = 'body'; body.textContent = x.text || '(图片)';
      d.appendChild(body);
      const acts = document.createElement('div'); acts.className = 'acts';
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '删除';
      del.onclick = () => ws.send(JSON.stringify({ type: 'admin_delete', id: x.id }));
      const geo = document.createElement('button'); geo.textContent = '📍 查看地点';
      geo.onclick = () => { geo.disabled = true; geo.textContent = '查询中…'; ws.send(JSON.stringify({ type: 'admin_geo_req', id: x.id })); };
      const geoSpan = document.createElement('span'); geoSpan.className = 'geo';
      acts.appendChild(del); acts.appendChild(geo); acts.appendChild(geoSpan);
      d.appendChild(acts);
      ul.appendChild(d);
    });
  }
  function renderStats(s) {
    $('onlineCount').textContent = s.online;
    $('peakCount').textContent = s.peak;
    $('distinctCount').textContent = s.distinct;
    $('sampleCount').textContent = (s.history || []).length;
    const ul = $('userList'); ul.innerHTML = '';
    (s.users || []).forEach(u => {
      const el = document.createElement('span'); el.className = 'u';
      el.textContent = u.name;
      const tag = u.role === 'admin' ? '👑' : u.role === 'guest' ? '访客' : '';
      if (tag) { const r = document.createElement('span'); r.className = 'r'; r.textContent = tag; el.appendChild(r); }
      ul.appendChild(el);
    });
    renderChart(s.history || []);
  }
  function renderChart(hist) {
    const W = 320, H = 150, pad = 22, box = $('chart');
    if (!hist || hist.length < 2) { box.innerHTML = '<div class="empty">数据采集中…（每 5 秒采样）</div>'; return; }
    const counts = hist.map(h => h.count);
    const maxC = Math.max.apply(null, counts.concat(1));
    const minC = Math.min.apply(null, counts.concat(0));
    const n = hist.length;
    const x = i => pad + (W - 2 * pad) * (i / (n - 1));
    const y = v => (H - pad) - (H - 2 * pad) * ((v - minC) / (maxC - minC || 1));
    const accent = (getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()) || '#8ab4ff';
    const pts = hist.map((h, i) => x(i).toFixed(1) + ',' + y(h.count).toFixed(1)).join(' ');
    const area = x(0).toFixed(1) + ',' + (H - pad) + ' ' + pts + ' ' + x(n - 1).toFixed(1) + ',' + (H - pad);
    let dots = ''; const step = Math.max(1, Math.ceil(n / 8));
    hist.forEach((h, i) => { if (i % step === 0) dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(h.count).toFixed(1) + '" r="2.2" fill="' + accent + '"/>'; });
    box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="100%" preserveAspectRatio="none">'
      + '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="#232733" stroke-width="1"/>'
      + '<polygon points="' + area + '" fill="' + accent + '22"/>'
      + '<polyline points="' + pts + '" fill="none" stroke="' + accent + '" stroke-width="2" stroke-linejoin="round"/>'
      + dots
      + '<text x="' + (W - pad) + '" y="14" fill="#9aa3b2" font-size="11" text-anchor="end">峰值 ' + maxC + '</text>'
      + '<text x="' + pad + '" y="14" fill="#9aa3b2" font-size="11">当前 ' + counts[n - 1] + '</text>'
      + '</svg>';
  }
</script>
</body>
</html>
